name: money_manager
description: Personal finance offline-first app - Flutter + Drift + Riverpod
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  fl_chart: ^0.66.0
  flutter_secure_storage: ^9.0.0
  json_annotation: ^4.9.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.3.0
  google_sign_in: ^6.2.0
  googleapis: ^12.0.0
  path_provider: ^2.1.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  drift_dev: ^2.35.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/