name: money_manager
description: Personal finance offline-first app - Flutter + Drift + Riverpod
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  intl: ^0.20.0
  google_fonts: ^6.2.1
  uuid: ^4.3.0
  crypto: ^3.0.3
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  package_info_plus: ^10.2.1
  url_launcher: ^6.2.0
  local_auth: ^2.1.0
  google_sign_in: ^6.2.0
  encrypt: ^5.0.3
  path_provider: ^2.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
